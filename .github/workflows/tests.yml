name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lecteurs Wikipédia, recherche, logos d'époque… sur des pages enregistrées (tests/fixtures)
      - run: pnpm test
      - run: npx tsc --noEmit
      - run: pnpm lint
