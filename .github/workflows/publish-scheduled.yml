name: Publications programmées

# Filet de sécurité : la publication à l'heure exacte est déclenchée par QStash
# (lib/scheduled-publish-trigger.ts). GitHub ne garantit pas ce cron (exécutions
# retardées de plusieurs heures, voire sautées) : il rattrape seulement ce que
# QStash aurait manqué. Lancement à la main : Actions → Run workflow.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publier les brouillons arrivés à échéance
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://memoiredauxerrois.fr' }}
        run: |
          curl --fail-with-body -sS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/publish-scheduled"
